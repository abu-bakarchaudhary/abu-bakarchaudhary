name: generate animated snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  push:
    branches:
      - main
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: abu-bakarchaudhary
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2DD4BF&color_dots=#0a0e17,#123446,#1b3a4b,#2DD4BF,#5eead4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#2DD4BF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
